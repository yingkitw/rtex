[package]
name = "rtex"
version = "0.1.1"
edition = "2024"
description = "Native TeX to PDF converter written in Rust with zero external LaTeX dependencies"
authors = ["Ying Kit WONG"]
license = "Apache-2.0"
repository = "https://github.com/yingkitw/rtex"
keywords = ["latex", "pdf", "tex", "converter", "typesetting"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.85"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.13"
chrono = "0.4"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
num_cpus = "1.16"
font-subset = "0.1.0"
wasm-bindgen = { version = "0.2", optional = true }
resvg = "0.45.1"
usvg = "0.45.1"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
sha2 = "0.10"
