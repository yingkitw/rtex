[package]
name = "latex-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.13"
chrono = "0.4"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
num_cpus = "1.16"
font-subset = "0.1.0"
ttf-parser = "0.25"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
sha2 = "0.10"
