[package]
name = "rtex"
version = "0.1.6"
edition = "2024"
description = "Native TeX to PDF converter written in Rust with zero external LaTeX dependencies"
authors = ["Ying Kit WONG"]
license = "Apache-2.0"
repository = "https://github.com/yingkitw/rtex"
documentation = "https://docs.rs/rtex/"
homepage = "https://github.com/yingkitw/rtex"
keywords = ["latex", "pdf", "tex", "converter", "typesetting"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.85"
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
lsp = ["dep:lsp-server", "dep:lsp-types"]
wasm = ["dep:wasm-bindgen"]
# Local debug harnesses under src/bin/debug_*.rs and test_*.rs
dev-bins = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
thiserror = "2.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
resvg = "0.45.1"
usvg = "0.45.1"
png = "0.18"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
pdfrs = "0.1.9"
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.97", optional = true }

[[bin]]
name = "rtex"
path = "src/main.rs"

[[bin]]
name = "rtex-lsp"
path = "src/bin/rtex-lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_math"
path = "src/bin/debug_math.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_texttt"
path = "src/bin/debug_texttt.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_parse_sample"
path = "src/bin/debug_parse_sample.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_parser"
path = "src/bin/debug_parser.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_font"
path = "src/bin/debug_font.rs"
required-features = ["dev-bins"]

[[bin]]
name = "debug_sample"
path = "src/bin/debug_sample.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_fraction_formatting"
path = "src/bin/test_fraction_formatting.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_pdf_output"
path = "src/bin/test_pdf_output.rs"
required-features = ["dev-bins"]

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.13"
