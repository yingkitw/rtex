[package]
name = "latex-rust"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A LaTeX processor written in Rust"
license = "MIT"
repository = "https://github.com/yourusername/latex-rust"

[features]
default = []
async = ["tokio", "futures"]

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
printpdf = "0.6"
tokio = { version = "1.0", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lexer_benchmarks"
harness = false

[[bench]]
name = "parser_benchmarks"
harness = false

[[bench]]
name = "renderer_benchmarks"
harness = false

[[bin]]
name = "latex-rust"
path = "src/main.rs"

[lib]
name = "latex_rust"
path = "src/lib.rs"

# Examples
[[example]]
name = "advanced_math_example"
path = "examples/rust_examples/advanced_math_example.rs"

[[example]]
name = "async_example"
path = "examples/rust_examples/async_example.rs"
required-features = ["async"]

[[example]]
name = "cache_example"
path = "examples/rust_examples/cache_example.rs"

[[example]]
name = "config_example"
path = "examples/rust_examples/config_example.rs"

[[example]]
name = "debug_tokens"
path = "examples/rust_examples/debug_tokens.rs"

[[example]]
name = "incremental_example"
path = "examples/rust_examples/incremental_example.rs"

[[example]]
name = "plugin_example"
path = "examples/rust_examples/plugin_example.rs"

[[example]]
name = "streaming_example"
path = "examples/rust_examples/streaming_example.rs"